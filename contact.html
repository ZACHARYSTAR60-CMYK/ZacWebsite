<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zac — Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* You can move this into style.css instead */
    .contact.container {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      font-family: system-ui, sans-serif;
    }
    .contact h2 {
      margin-bottom: 20px;
    }
    .contact form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .contact label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }
    .contact input,
    .contact textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .contact button {
      padding: 12px 20px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      width: fit-content;
    }
    .contact button:hover {
      background: #444;
    }
    .form-status {
      margin-top: 10px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- ============ HEADER (shared) ============ -->
  <div id="header-placeholder"></div>

  <div class="contact container">
    <h2>Contact me</h2>

    <!--
      1. Sign up free at https://formspree.io
      2. Create a form there, get your unique form ID
      3. Replace YOUR_FORM_ID below with it
      Submissions will land straight in your email inbox.
    -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" id="contactForm">
      <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div>
        <label for="email">Your email:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Send Message</button>
      <p class="form-status" id="formStatus"></p>
    </form>
  </div>

  <!-- ============ FOOTER (shared) ============ -->
  <div id="footer-placeholder"></div>

  <script>
    // Submits via fetch so the page doesn't reload and you can show a nice message
    const form = document.getElementById('contactForm');
    const status = document.getElementById('formStatus');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const data = new FormData(form);
      status.textContent = 'Sending...';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          status.textContent = "Thanks! Your message has been sent.";
          form.reset();
        } else {
          status.textContent = "Oops, something went wrong. Please try again.";
        }
      } catch (error) {
        status.textContent = "Network error — please try again later.";
      }
    });
  </script>
  <script src="includes.js"></script>
</body>
</html>
